<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yango MKT Venezuela</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --red:#ff1a1a;
      --red-dark:#b50013;
      --ink:#101828;
      --muted:#66758f;
      --soft:#f6f8fb;
      --line:#dfe7f2;
      --card:#ffffff;
      --green:#16a34a;
      --blue:#0ea5e9;
      --orange:#f97316;
      --purple:#8b5cf6;
      --shadow:0 18px 55px rgba(16,24,40,.10);
    }

    * { box-sizing:border-box; }
    body {
      margin:0;
      background:var(--soft);
      color:var(--ink);
      font-family:"YangoText", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size:13px;
    }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }

    label {
      display:block;
      margin-bottom:6px;
      color:#71809a;
      font-size:11px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    input,select,textarea {
      width:100%;
      min-height:42px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      outline:none;
      background:#fff;
      color:var(--ink);
    }
    textarea { min-height:76px; resize:vertical; }

    .btn {
      border:0;
      border-radius:999px;
      padding:11px 16px;
      background:var(--ink);
      color:#fff;
      font-weight:900;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      white-space:nowrap;
    }
    .btn.red { background:var(--red); }
    .btn.light { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .btn.small { padding:8px 11px; font-size:12px; }
    .btn.danger { color:var(--red); }

    .login {
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:radial-gradient(circle at top left,#fff 0,#f9fafb 35%,#eef3f9 100%);
    }
    .login-card {
      width:min(460px,100%);
      background:#fff;
      border:1px solid var(--line);
      border-radius:30px;
      padding:34px;
      box-shadow:var(--shadow);
    }
    .mark {
      width:48px;
      height:48px;
      border-radius:17px;
      display:grid;
      place-items:center;
      background:var(--red);
      color:#fff;
      font-size:30px;
      font-weight:950;
      letter-spacing:-.08em;
    }
    .login h1 { margin:18px 0 6px; font-size:34px; letter-spacing:-.05em; }
    .login p { margin:0 0 20px; color:var(--muted); }

    .app { min-height:100vh; display:grid; grid-template-columns:272px 1fr; }
    .side {
      background:#fff;
      border-right:1px solid var(--line);
      padding:24px 18px;
      position:sticky;
      top:0;
      height:100vh;
      overflow:auto;
    }
    .brand { display:flex; gap:12px; align-items:center; margin-bottom:30px; }
    .brand .mark { width:42px; height:42px; border-radius:15px; font-size:27px; }
    .brand strong { display:block; font-size:15px; }
    .brand span { display:block; color:var(--muted); font-size:12px; }
    .nav-title {
      margin:24px 10px 9px;
      font-size:11px;
      color:#99a6ba;
      font-weight:950;
      text-transform:uppercase;
      letter-spacing:.14em;
    }
    .nav { display:grid; gap:7px; }
    .nav button {
      border:1px solid transparent;
      background:transparent;
      color:#526176;
      text-align:left;
      padding:12px 13px;
      border-radius:16px;
      font-weight:900;
    }
    .nav button.active { background:#fff1f1; border-color:#ffd8d8; color:var(--red); }
    .side-foot { margin-top:28px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    .sync-dot { display:inline-flex; align-items:center; gap:7px; font-weight:800; }
    .sync-dot:before { content:""; width:8px; height:8px; border-radius:50%; background:var(--green); }
    .sync-dot.warn:before { background:#d97706; }
    .sync-dot.err:before { background:var(--red); }

    .main { width:100%; max-width:1620px; margin:0 auto; padding:32px; min-width:0; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:22px; }
    .top h1 {
      margin:0;
      font-family:"YangoHeadline","YangoText",system-ui,sans-serif;
      font-size:34px;
      line-height:.9;
      letter-spacing:-.06em;
      text-transform:uppercase;
    }
    .top p { margin:8px 0 0; color:var(--muted); font-size:15px; }
    .userbar { display:flex; gap:9px; align-items:center; }

    .hero {
      border-radius:28px;
      padding:26px 28px;
      margin-bottom:22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      color:#fff;
      background:linear-gradient(135deg,#121522 0%,#3a111f 44%,#e60012 100%);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .hero h2 {
      margin:0 0 7px;
      font-size:29px;
      line-height:1;
      letter-spacing:-.04em;
    }
    .hero p { margin:0; color:rgba(255,255,255,.82); font-size:15px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .actions .btn.light { background:#fff; color:var(--ink); }

    .cards {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:13px;
      margin-bottom:22px;
    }
    .card {
      background:#fff;
      border:1px solid var(--line);
      border-radius:22px;
      padding:20px 18px;
      min-height:142px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      box-shadow:0 8px 30px rgba(16,24,40,.025);
    }
    .icon {
      width:42px;
      height:42px;
      border-radius:14px;
      display:grid;
      place-items:center;
      margin-bottom:12px;
      font-weight:950;
    }
    .i-red { background:#ffe9e9; color:var(--red); }
    .i-blue { background:#e8f6ff; color:var(--blue); }
    .i-green { background:#e9fbef; color:var(--green); }
    .i-purple { background:#f0e8ff; color:var(--purple); }
    .i-orange { background:#fff1e7; color:var(--orange); }
    .i-gray { background:#eef2f7; color:var(--ink); }
    .metric {
      font-family:"YangoHeadline","YangoText",system-ui,sans-serif;
      font-size:31px;
      font-weight:950;
      line-height:.9;
      letter-spacing:-.07em;
      margin-bottom:8px;
    }
    .card span { color:var(--muted); font-size:14px; font-weight:800; }
    .cards.compact {
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:10px;
      margin-bottom:18px;
    }
    .cards.compact .card {
      min-height:96px;
      padding:14px 12px;
      border-radius:18px;
    }
    .cards.compact .icon {
      width:30px;
      height:30px;
      border-radius:10px;
      margin-bottom:8px;
      font-size:12px;
    }
    .cards.compact .metric { font-size:24px; margin-bottom:5px; }
    .cards.compact .card span { font-size:12px; }

    .filters {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:14px;
      align-items:end;
      margin-bottom:18px;
    }
    .filter-field button { width:100%; min-height:42px; }

    .panel {
      background:#fff;
      border:1px solid var(--line);
      border-radius:24px;
      padding:20px;
      box-shadow:0 8px 30px rgba(16,24,40,.03);
      overflow:hidden;
    }
    .panel-head { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:16px; }
    .panel h3 { margin:0; font-size:20px; }
    .panel p { margin:4px 0 0; color:var(--muted); }
    .table-wrap { overflow:auto; border:1px solid #eef2f7; border-radius:18px; }
    table { width:100%; border-collapse:collapse; min-width:1320px; }
    th,td { padding:14px 16px; border-bottom:1px solid #eef2f7; text-align:left; vertical-align:top; }
    th {
      color:#9aa8bd;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:950;
    }
    td { font-size:13px; }
    .name { font-size:15px; font-weight:950; }
    .muted { color:var(--muted); }
    .tiny { font-size:12px; line-height:1.45; }
    .result-block { min-width:160px; line-height:1.45; }
    .result-title { color:var(--red); font-weight:950; }
    .row-actions { display:flex; gap:7px; }
    .empty { padding:34px; text-align:center; color:var(--muted); }
    .badge {
      display:inline-flex;
      align-items:center;
      gap:6px;
      border-radius:999px;
      padding:6px 10px;
      background:#eef3f9;
      color:#526176;
      font-size:11px;
      font-weight:900;
      margin:2px 0;
    }
    .badge.red { background:#ffe9e9; color:var(--red); }
    .badge.blue { background:#e8f6ff; color:var(--blue); }
    .badge.green { background:#e9fbef; color:var(--green); }
    .badge.gray { background:#eef2f7; color:#64748b; }
    .badge.orange { background:#fff1e7; color:#c2410c; }
    .badge.pink { background:#fce7f3; color:#db2777; }
    .badge.purple { background:#f0e8ff; color:var(--purple); }
    .linkish { color:var(--red); font-weight:950; text-decoration:none; }

    .section-stack { display:grid; gap:22px; }
    .split-2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .split-3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
    .mini-list { display:grid; gap:10px; }
    .mini-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid #eef2f7; }
    .mini-row:last-child { border-bottom:0; }
    .bar { height:9px; border-radius:99px; background:#eef2f7; overflow:hidden; margin-top:8px; }
    .bar span { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--red),#ff7a7a); }
    .smm-shell { display:grid; gap:18px; }
    .smm-toolbar {
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:14px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }
    .smm-toolbar .field { min-width:220px; }
    .smm-channel-grid {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:16px;
    }
    .smm-channel-card {
      position:relative;
      background:#fff;
      border:1px solid var(--line);
      border-radius:28px;
      padding:18px;
      overflow:hidden;
      box-shadow:0 10px 34px rgba(16,24,40,.04);
    }
    .smm-channel-card:before {
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:6px;
      background:var(--channel,#ff1a1a);
    }
    .smm-channel-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:5px 0 16px;
    }
    .smm-channel-title { display:flex; align-items:center; gap:10px; }
    .smm-channel-icon {
      width:42px;
      height:42px;
      border-radius:16px;
      display:grid;
      place-items:center;
      background:var(--channel-soft,#ffe9e9);
      color:var(--channel,#ff1a1a);
      font-weight:950;
      font-size:18px;
    }
    .smm-channel-title h3 {
      margin:0;
      font-size:19px;
      line-height:1;
    }
    .smm-channel-title p { margin:4px 0 0; color:var(--muted); font-size:12px; font-weight:800; }
    .smm-big-metric {
      padding:15px;
      border-radius:22px;
      background:linear-gradient(180deg,#f8fafc,#fff);
      border:1px solid #eef2f7;
      margin-bottom:12px;
    }
    .smm-big-metric .value {
      font-family:"YangoHeadline","YangoText",system-ui,sans-serif;
      font-size:39px;
      line-height:.9;
      letter-spacing:-.07em;
      font-weight:950;
      color:var(--ink);
    }
    .smm-big-metric .label { margin-top:7px; color:var(--muted); font-weight:900; }
    .smm-metric-grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }
    .smm-metric-box {
      border:1px solid #eef2f7;
      background:#fbfdff;
      border-radius:18px;
      padding:12px;
      min-height:86px;
    }
    .smm-metric-box strong {
      display:block;
      font-family:"YangoHeadline","YangoText",system-ui,sans-serif;
      font-size:25px;
      line-height:.9;
      letter-spacing:-.06em;
      margin-bottom:7px;
      color:var(--ink);
    }
    .smm-metric-box span { color:var(--muted); font-weight:850; font-size:12px; }
    .smm-organic-strip {
      margin-top:12px;
      border-radius:20px;
      background:#101828;
      color:#fff;
      padding:14px;
    }
    .smm-organic-strip .title {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
      color:rgba(255,255,255,.78);
      font-weight:900;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.08em;
    }
    .smm-organic-grid {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
    }
    .smm-organic-grid div {
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      border-radius:14px;
      padding:9px;
    }
    .smm-organic-grid strong {
      display:block;
      font-size:15px;
      margin-bottom:4px;
    }
    .smm-organic-grid span {
      color:rgba(255,255,255,.62);
      font-size:11px;
      font-weight:800;
    }
    .smm-report-table table { min-width:1180px; }
    .smm-month-cell strong { display:block; font-size:15px; margin-bottom:4px; }
    .smm-channel-cell {
      min-width:260px;
      display:grid;
      gap:8px;
    }
    .smm-cell-row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      padding:7px 9px;
      border-radius:12px;
      background:#f8fafc;
      color:#526176;
      font-weight:850;
    }
    .smm-cell-row b { color:var(--ink); }
    .smm-note {
      margin-top:10px;
      color:#71809a;
      font-size:12px;
      font-weight:800;
    }
    .budget-hero { background:linear-gradient(135deg,#0f172a 0%,#172554 48%,#ff1a1a 100%); }
    .budget-meta { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .budget-meta a,.budget-meta span { color:#fff; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:8px 11px; text-decoration:none; font-weight:900; font-size:12px; }
    .budget-grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr); gap:18px; align-items:start; }
    .budget-row-title { display:flex; align-items:center; gap:9px; font-weight:950; }
    .budget-color { width:10px; height:10px; border-radius:50%; display:inline-block; }
    .budget-money { font-weight:950; white-space:nowrap; }
    .budget-progress { min-width:150px; }
    .budget-progress .bar { margin-top:0; height:10px; }
    .budget-progress small { display:block; margin-top:5px; color:var(--muted); font-weight:800; }
    .budget-kpis { grid-template-columns:repeat(6,minmax(0,1fr)); }
    .budget-kpis .card { min-height:118px; }
    .expense-desc { max-width:380px; line-height:1.35; color:#526176; }
    .location-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
    .location-card { background:#f8fafc; border:1px solid #e7eef7; border-radius:18px; padding:14px; min-height:92px; }
    .location-card strong { display:block; margin-bottom:7px; }
    .funnel { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-items:center; }
    .funnel-card { background:#f8fafc; border:1px solid #eef2f7; border-radius:20px; padding:18px; text-align:center; min-height:128px; }
    .funnel-card .metric { margin-top:8px; }
    .activity-list { display:grid; gap:10px; }
    .activity-row { display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; padding:15px 18px; border:1px solid #e7eef7; border-radius:18px; background:#fff; }
    .activity-meta { color:var(--muted); margin-top:5px; font-size:12px; font-weight:700; }
    .activity-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .calendar-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    .calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:9px; }
    .cal-head { color:#93a1b5; font-weight:950; text-align:center; padding:8px; }
    .cal-day { min-height:120px; background:#fff; border:1px solid #e7eef7; border-radius:18px; padding:10px; overflow:hidden; }
    .cal-day.today { border-color:var(--red); box-shadow:0 0 0 3px #ffe1e1 inset; }
    .cal-day.out { background:#f8fafc; color:#b0bbcc; }
    .cal-num { font-weight:950; color:#71809a; margin-bottom:7px; }
    .cal-item { display:block; width:100%; text-align:left; border:0; border-left:4px solid #64748b; border-radius:10px; padding:5px 7px; margin-bottom:5px; background:#f1f5f9; color:#526176; font-size:11px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .comm-text-preview { max-width:340px; color:#526176; line-height:1.45; }
    .comm-calendar .cal-day { min-height:140px; }
    .comm-chip { cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
    .comm-chip:hover { transform:translateY(-1px); box-shadow:0 8px 18px rgba(16,24,40,.08); }
    .comm-image-link { color:var(--red); font-weight:950; text-decoration:none; }
    .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle; }
    .agency-shell { min-height:100vh; padding:28px; background:#f6f8fb; }
    .agency-shell .main { padding:0; }
    .photo-chip { display:inline-flex; align-items:center; gap:5px; margin:3px 5px 3px 0; padding:6px 9px; border-radius:999px; background:#eef2f7; color:#526176; font-weight:900; text-decoration:none; font-size:11px; }
    .ooh-map {
      position:relative;
      height:560px;
      border:1px solid #dfe7f2;
      border-radius:24px;
      overflow:hidden;
      background:#dbe3eb;
      box-shadow:0 14px 40px rgba(16,24,40,.07);
    }
    #oohLeafletMap {
      width:100%;
      height:100%;
      border-radius:24px;
    }
    .ooh-leaflet-pin {
      display:block;
      width:20px;
      height:20px;
      border-radius:50%;
      border:3px solid #fff;
      box-shadow:0 10px 22px rgba(16,24,40,.28);
    }
    .leaflet-container { font-family:"YangoText", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .leaflet-popup-content-wrapper { border-radius:16px; box-shadow:0 16px 40px rgba(16,24,40,.18); }
    .leaflet-popup-content { margin:12px 14px; color:var(--ink); font-weight:800; }
    .leaflet-control-attribution { font-size:10px; }
    .map-counter {
      position:absolute;
      left:16px;
      bottom:16px;
      z-index:700;
      background:#fff;
      border-radius:999px;
      padding:10px 14px;
      box-shadow:0 12px 30px rgba(16,24,40,.14);
      font-weight:950;
      pointer-events:none;
    }
    .map-empty {
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:var(--muted);
      font-weight:900;
      text-align:center;
      padding:30px;
      z-index:650;
      pointer-events:none;
    }
    .legend { display:flex; gap:14px; flex-wrap:wrap; align-items:center; color:var(--muted); font-size:12px; font-weight:800; }
    .ooh-photo-links { display:flex; gap:6px; flex-wrap:wrap; }
    .location-search-row { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:end; }
    .geo-status { margin-top:7px; color:var(--muted); font-size:12px; font-weight:800; }
    .geo-status.ok { color:var(--green); }
    .geo-status.err { color:var(--red); }

    .modal { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:50; }
    .modal.open { display:flex; }
    .modal-card { background:#fff; border-radius:30px; width:min(1080px,100%); max-height:90vh; overflow:auto; padding:24px; box-shadow:var(--shadow); }
    .modal-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:18px; }
    .modal-head h2 { margin:0; font-size:30px; letter-spacing:-.04em; }
    .form-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .form-grid .wide { grid-column:1/-1; }

function uid(prefix='id'){ return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function cleanNumberString(v){
  let s=String(v??'').trim().replace(/[$%\s]/g,'');
  if(!s) return '';
  const comma=s.lastIndexOf(','), dot=s.lastIndexOf('.');
  if(comma>=0 && dot>=0) s = comma>dot ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(comma>=0) s = /,\d{1,2}$/.test(s) ? s.replace(',','.') : s.replace(/,/g,'');
  return s;
}
function n(v){ const x=Number(cleanNumberString(v)); return Number.isFinite(x)?x:0; }
function normalizeOOHCoord(value,kind){
  let v=n(value);
  if(!v) return 0;
  if(kind==='lat'){
    while(Math.abs(v)>90) v/=10;
  }else{
    while(Math.abs(v)>180) v/=10;
    while(Math.abs(v)>0 && Math.abs(v)<10) v*=10;
  }
  return v;
}
function money(v){ return '$'+n(v).toLocaleString('es-VE'); }
function num(v){ return n(v).toLocaleString('es-VE'); }
function pct(v){ const x=n(v); return x.toLocaleString('es-VE',{maximumFractionDigits:1})+'%'; }
function compactNum(v){
  const x=n(v);
  const abs=Math.abs(x);
  if(abs>=1000000) return (x/1000000).toLocaleString('es-VE',{maximumFractionDigits:1})+'M';
  if(abs>=1000) return (x/1000).toLocaleString('es-VE',{maximumFractionDigits:1})+'K';
  return num(x);
}
function esc(v){ return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sel(a,b){ return a===b?'value="'+b+'" selected':'value="'+b+'"'; }
function boolish(v){ return v===true || String(v).toLowerCase()==='true' || String(v).toLowerCase()==='sí' || String(v).toLowerCase()==='si'; }
function normDate(v){
  if(!v) return '';
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return '';
}
function fmtDate(d){ const v=normDate(d); if(!v)return '—'; const [y,m,day]=v.split('-'); return `${day}/${m}/${y}`; }
function dateInRange(value,from,to){ const v=normDate(value); return (!from||(v&&v>=from))&&(!to||(v&&v<=to)); }
function monthLabel(m){ if(!m)return '—'; const [y,mo]=String(m).split('-'); const names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; return `${names[Number(mo)-1]||mo} ${y}`; }
function tiktokUser(x){ return String(x.tiktok_username||'').trim() || String(x.ig_username||'').trim(); }
function totalReach(x){ return n(x.reach_total) || n(x.ig_reach)+n(x.tiktok_reach); }
function totalEngagement(x){ return n(x.engagement_total) || n(x.ig_likes)+n(x.ig_comments)+n(x.ig_shares)+n(x.ig_saves)+n(x.tiktok_likes)+n(x.tiktok_comments)+n(x.tiktok_shares)+n(x.tiktok_saves); }
function calcER(list){ const reach=list.reduce((s,x)=>s+totalReach(x),0); const eng=list.reduce((s,x)=>s+totalEngagement(x),0); return reach ? eng/reach*100 : 0; }

function splitExtraNotes(notes){
  const raw=String(notes||'');
  const idx=raw.indexOf(EXTRA_MARKER);
  if(idx<0) return { notes:raw, extra:{} };
  const plain=raw.slice(0,idx).trim();
  const json=raw.slice(idx+EXTRA_MARKER.length).trim();
  try{ return { notes:plain, extra:JSON.parse(json)||{} }; }
  catch(e){ return { notes:raw, extra:{} }; }
}
function reportExtra(x){
  const raw=String(x?.notes||'').trim();
  if(!raw) return {};
  const parsed=splitExtraNotes(raw);
  const candidate=Object.keys(parsed.extra||{}).length ? parsed.extra : parsed.notes;
  if(candidate && typeof candidate==='object') return candidate;
  try{
    const data=JSON.parse(String(candidate||'').trim());
    return data && typeof data==='object' ? data : {};
  }catch(e){
    return {};
  }
}
function reportNoteText(x){
  const extra=reportExtra(x);
  if(extra.note) return extra.note;
  const raw=String(x?.notes||'').trim();
  if(!raw || raw[0]==='{') return '';
  return splitExtraNotes(raw).notes;
}
const SMM_CHANNELS = [
  { id:'instagram', label:'Instagram', short:'IG', color:'#ff1a1a', soft:'#ffe9e9', icon:'◎', reachLabel:'Reach' },
  { id:'tiktok', label:'TikTok', short:'TT', color:'#101828', soft:'#eef2f7', icon:'♪', reachLabel:'Views / reach' },
  { id:'facebook', label:'Facebook', short:'FB', color:'#1877f2', soft:'#e8f2ff', icon:'f', reachLabel:'Reach' },
];
function smmMetric(x, channel, metric){
  const extra=reportExtra(x);
  const map={
    instagram:{ followers:'ig_followers', reach:'ig_reach', clicks:'ig_clicks', installs:'ig_installs', orders:'ig_orders' },
    tiktok:{ followers:'tiktok_followers', reach:'tiktok_reach', clicks:'tiktok_clicks', installs:'tiktok_installs', orders:'tiktok_orders' },
    facebook:{ followers:'facebook_followers', reach:'facebook_reach', clicks:'facebook_clicks', installs:'facebook_installs', orders:'facebook_orders' },
  };
  const key=map[channel]?.[metric];
  if(!key) return 0;
  if(key in x) return n(x[key]);
  return n(extra[key]);
}
function smmOrganic(x, channel, metric){
  const extra=reportExtra(x);
  return n(extra?.organic?.[channel]?.[metric]);
}
function smmTotals(list, channel){
  const months=Math.max(1,list.length);
  return {
    followers:list.reduce((s,x)=>s+smmMetric(x,channel,'followers'),0),
    reach:list.reduce((s,x)=>s+smmMetric(x,channel,'reach'),0),
    clicks:list.reduce((s,x)=>s+smmMetric(x,channel,'clicks'),0),
    installs:list.reduce((s,x)=>s+smmMetric(x,channel,'installs'),0),
    orders:list.reduce((s,x)=>s+smmMetric(x,channel,'orders'),0),
    aorp:list.reduce((s,x)=>s+smmOrganic(x,channel,'aorp'),0)/months,
    arp_total:list.reduce((s,x)=>s+smmOrganic(x,channel,'arp_total'),0),
    ors_pct:list.reduce((s,x)=>s+smmOrganic(x,channel,'ors_pct'),0)/months,
  };
}
function hydrateInfluencer(x){
  const parsed=splitExtraNotes(x.notes);
  const out={...x};
  INFLUENCER_EXTRA_KEYS.forEach(k=>{
    if((out[k]===undefined || out[k]==='') && parsed.extra[k]!==undefined) out[k]=parsed.extra[k];
  });
  out.notes=parsed.notes;
  return out;
}
function payloadInfluencer(x){
  const plain=splitExtraNotes(x.notes).notes;
  const extra={};
  INFLUENCER_EXTRA_KEYS.forEach(k=>{ if(x[k]!==undefined && x[k]!==null && x[k]!=='') extra[k]=x[k]; });
  return { ...x, notes: plain + EXTRA_MARKER + JSON.stringify(extra) };
}

async function api(action,payload={}){
  const r=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,payload,actor:app.session?.id||'anonymous',at:new Date().toISOString()})});
  let data={};
  try{ data=await r.json(); }catch(e){}
  if(!r.ok||data.ok===false) throw new Error(data.error||'No se pudo guardar en Google Sheets');
  return data;
}
async function load(silent=false){
  let shouldRender=!silent;
  try{
    if(!silent) app.loading=true;
    if(!silent) render();
    const r=await fetch('/api/sync?action=bootstrap',{cache:'no-store'});
    const data=await r.json();
    if(data.ok===false) throw new Error(data.error||'Sync error');
    const nextSignature=JSON.stringify({
      users:data.users||[],
      influencers:data.influencers||[],
      socialReports:data.socialReports||[],
      btlActivations:data.btlActivations||[],
      btlResults:data.btlResults||[],
      agencyReports:data.agencyReports||[],
      btlBudgets:data.btlBudgets||[],
      oohItems:data.oohItems||[],
      driverComms:data.driverComms||[],
      budgetSource:data.budgetSource||null
    });
    if(silent && nextSignature!==app.dataSignature) shouldRender=true;
    app.dataSignature=nextSignature;
    app.users=(data.users&&data.users.length?data.users:DEFAULT_USERS).filter(u=>u.active!==false);
    app.influencers=(data.influencers||[]).map(hydrateInfluencer).filter(x=>!x.deleted_at);
    app.socialReports=(data.socialReports||[]).filter(x=>!x.deleted_at);
    app.btlActivations=(data.btlActivations||[]).filter(x=>!x.deleted_at);
    app.btlResults=(data.btlResults||[]).filter(x=>!x.deleted_at);
    app.agencyReports=(data.agencyReports||[]).filter(x=>!x.deleted_at);
    app.btlBudgets=(data.btlBudgets||[]).filter(x=>!x.deleted_at);
    app.oohItems=(data.oohItems||[]).filter(x=>!x.deleted_at);
    app.driverComms=(data.driverComms||[]).filter(x=>!x.deleted_at);
    app.budgetSource=data.budgetSource||null;
    if(!app.budgetFilters.period){
      const periods=(app.budgetSource?.periods||[]).map(x=>x.period).filter(Boolean);
      app.budgetFilters.period=periods[0]||new Date().toISOString().slice(0,7);
    }
    app.sync='ok';
    app.lastSync=new Date();
  }catch(e){
    app.users=app.users.length?app.users:DEFAULT_USERS;
    app.sync='err';
    shouldRender=!silent;
    if(!silent) toast('No pude leer Google Sheets: '+e.message,'err');
  }finally{
    app.loading=false;
    if(shouldRender) render();
  }
}

function budgetSource(){ return app.budgetSource || { ok:false, model:[], expenses:[], expense_months:[], summary:[], periods:[] }; }
function budgetPeriods(){
  const b=budgetSource();
  const seen={};
  (b.periods||[]).forEach(x=>{ if(x.period) seen[x.period]=x.label||monthLabel(x.period); });
  (b.model||[]).forEach(x=>{ if(x.period) seen[x.period]=x.label||monthLabel(x.period); });

}

}
function budgetStatusOptions(){
  const b=budgetSource();
  return [...new Set((b.expenses||[]).map(x=>String(x.status||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
}
function budgetModelRows(period){
  const rows=(budgetSource().model||[]).filter(x=>x.period===period);
  const map={};
  rows.forEach(x=>{
    const category=String(x.category||'Sin categoría').trim();
    if(!map[category]) map[category]={category,budget:0,actual:0,estimation:0};
    map[category].budget+=n(x.budget);
    map[category].actual+=n(x.actual);
    map[category].estimation+=n(x.estimation);
  });
  return Object.values(map)
    .filter(x=>n(x.budget)||n(x.actual)||n(x.estimation))
    .sort((a,b)=>(n(b.budget)+n(b.actual)+n(b.estimation))-(n(a.budget)+n(a.actual)+n(a.estimation)))
    .slice(0,24);
}
function budgetExpenseRows(period){
  return (budgetSource().expenses||[]).filter(x=>{
    return (!period||x.period===period)
      && (app.budgetFilters.area==='all'||String(x.area||'')===app.budgetFilters.area)
      && (app.budgetFilters.status==='all'||String(x.status||'')===app.budgetFilters.status);
  });
}
function budgetSummaryRow(period){ return (budgetSource().summary||[]).find(x=>x.period===period) || null; }
function budgetMetrics(period){
  const model=budgetModelRows(period);
  const expenses=budgetExpenseRows(period);
  const summary=budgetSummaryRow(period);
  const modelBudget=model.reduce((s,x)=>s+n(x.budget),0);
  const modelActual=model.reduce((s,x)=>s+n(x.actual),0);
  const modelForecast=model.reduce((s,x)=>s+n(x.estimation),0);
  const expenseActual=expenses.reduce((s,x)=>s+n(x.amount),0);
  const budget=n(summary?.budget)||modelBudget;
  const actual=n(summary?.actual)||modelActual||expenseActual;
  const forecast=modelForecast||actual;
  const diff=n(summary?.diff)||(budget-actual);
  return { budget, actual, forecast, diff, expenseActual, expenses:expenses.length, used:budget?actual/budget*100:0 };
}
function budgetColor(name){
  const colors=['#ff1a1a','#0ea5e9','#16a34a','#8b5cf6','#f97316','#ec4899','#64748b','#b45309'];

  return colors[sum%colors.length];
}

function oohColor(type){ return OOH_TYPE_COLORS[type] || OOH_TYPE_COLORS.Otro; }

function photoLinks(value){
  const raw=String(value||'').trim();
  if(!raw) return [];
  try{
    const parsed=JSON.parse(raw);
    if(Array.isArray(parsed)) return parsed.filter(Boolean);
  }catch(e){}

}
function oohFilteredItems(){
  return app.oohItems.filter(x=>{
    return (app.oohFilters.type==='all'||x.type===app.oohFilters.type)
      && (app.oohFilters.status==='all'||oohStatus(x)===app.oohFilters.status)

function oohMetrics(list=oohFilteredItems()){
  const active=list.filter(x=>oohStatus(x)==='active');
  return {
    total:list.length,
    active:active.length,
    planned:list.filter(x=>oohStatus(x)==='planned').length,
    paused:list.filter(x=>oohStatus(x)==='paused').length,
    reach:active.reduce((s,x)=>s+n(x.estimated_reach),0),
    cost:active.reduce((s,x)=>s+n(x.monthly_cost),0),
    photos:list.reduce((s,x)=>s+photoLinks(x.photo_urls).length,0),
  };

function oohPoint(item,index=0){
  const lat=normalizeOOHCoord(item.lat,'lat'), lng=normalizeOOHCoord(item.lng,'lng');
  if(lat && lng) return {lat,lng};
  const lookup=[item.location,item.address,item.zone].map(v=>String(v||'').trim()).find(v=>CARACAS_POINTS[v]);
  const base=CARACAS_POINTS[lookup] || CARACAS_POINTS.Caracas;
  const jitter=((index%9)-4)*0.0022;
  return { lat:base.lat+jitter, lng:base.lng+(((index*3)%9)-4)*0.0026 };
}
function knownCaracasPoint(query){
  const clean=String(query||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const hit=Object.entries(CARACAS_POINTS).find(([name])=>clean.includes(name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')));
  return hit ? hit[1] : null;
}
async function geocodeOOHFromForm(){
  const form=document.getElementById('modalForm');
  if(!form) return;
  const status=form.querySelector('[data-geo-status]');
  const latInput=form.querySelector('[name="lat"]');
  const lngInput=form.querySelector('[name="lng"]');
  const address=String(form.address?.value||'').trim();
  const location=String(form.location?.value||'').trim();
  const zone=String(form.zone?.value||'').trim();
  const query=[address,location,zone,'Caracas Venezuela'].filter(Boolean).join(', ');
  if(!address && !location){
    if(status){ status.className='geo-status err'; status.textContent='Escribe una ubicación o referencia para ubicar el punto.'; }
    return;
  }
  if(status){ status.className='geo-status'; status.textContent='Buscando ubicación...'; }
  try{
    const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ve&q='+encodeURIComponent(query);
    const res=await fetch(url);
    if(!res.ok) throw new Error('No respondió el buscador');
    const data=await res.json();
    if(data && data[0]){
      latInput.value=Number(data[0].lat).toFixed(6);
      lngInput.value=Number(data[0].lon).toFixed(6);
      if(status){ status.className='geo-status ok'; status.textContent='Ubicación encontrada y guardada para el mapa.'; }
      return;
    }
    throw new Error('Sin resultado exacto');
  }catch(e){
    const fallback=knownCaracasPoint([address,location,zone].join(' '));
    if(fallback){
      latInput.value=fallback.lat;
      lngInput.value=fallback.lng;
      if(status){ status.className='geo-status ok'; status.textContent='No conseguí match exacto, usé la referencia/zona de Caracas para ubicarlo aproximado.'; }
    }else if(status){
      status.className='geo-status err';
      status.textContent='No pude ubicarlo automático. Prueba con una referencia más específica: “Metro Chacaíto, Caracas”.';
    }
  }
}

}
async function resolveOOHCoordinates(obj){
  if(n(obj.lat) && n(obj.lng)) return obj;
  const query=[obj.address,obj.location,obj.zone,'Caracas Venezuela'].map(v=>String(v||'').trim()).filter(Boolean).join(', ');
  if(!query) return obj;
  try{
    const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ve&q='+encodeURIComponent(query));
    if(res.ok){
      const data=await res.json();
      if(data && data[0]){
        obj.lat=Number(data[0].lat).toFixed(6);
        obj.lng=Number(data[0].lon).toFixed(6);
        return obj;
      }
    }
  }catch(e){}
  const fallback=knownCaracasPoint(query);
  if(fallback){ obj.lat=fallback.lat; obj.lng=fallback.lng; }
  return obj;
}
function oohXY(point){
  const minLat=10.335, maxLat=10.535, minLng=-67.095, maxLng=-66.780;
  const x=Math.max(2,Math.min(98,(point.lng-minLng)/(maxLng-minLng)*100));
  const y=Math.max(2,Math.min(98,(maxLat-point.lat)/(maxLat-minLat)*100));
  return {x,y};
}

function initOOHLeafletMap(){
  const el=document.getElementById('oohLeafletMap');
  if(!el) return;
  if(typeof L==='undefined'){
    el.innerHTML='<div class="map-empty">No pude cargar el mapa real. Revisa conexión y recarga.</div>';
    return;
  }
  const list=oohFilteredItems();
  oohLeafletMap=null;
  const map=L.map(el,{scrollWheelZoom:true,zoomControl:true,preferCanvas:true}).setView([10.49,-66.88],12);
  oohLeafletMap=map;
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; OpenStreetMap &copy; CARTO',
    subdomains:'abcd',
    maxZoom:20
  }).addTo(map);
  const bounds=[];
  list.forEach((item,i)=>{
    const p=oohPoint(item,i);
    if(!p.lat||!p.lng) return;
    const color=oohColor(item.type);
    const icon=L.divIcon({
      className:'',
      html:`<span class="ooh-leaflet-pin" style="background:${color}"></span>`,
      iconSize:[20,20],
      iconAnchor:[10,10],
      popupAnchor:[0,-10]
    });
    const title=`${item.name||'OOH'} · ${item.type||'Tipo'} · ${item.location||item.zone||'Caracas'}`;
    const marker=L.marker([p.lat,p.lng],{icon}).addTo(map);
    marker.bindTooltip(esc(title),{direction:'top',offset:[0,-12]});
    marker.bindPopup(`<strong>${esc(item.name||'OOH')}</strong><br>${esc(item.type||'Tipo')} · ${esc(item.location||item.zone||'Caracas')}<br><button class="btn red small" style="margin-top:10px" onclick="openOOHItem('${esc(item.id)}')">Editar</button>`);
    marker.on('click',()=>openOOHItem(item.id));
    bounds.push([p.lat,p.lng]);
  });
  if(bounds.length) map.fitBounds(bounds,{padding:[42,42],maxZoom:14});
  setTimeout(()=>map.invalidateSize(),80);
}

function driverCommCalendar(list){
  const month=app.driverCommFilters.month || new Date().toISOString().slice(0,7);
  const [y,m]=month.split('-').map(Number);
  const first=new Date(y,m-1,1);
  const daysInMonth=new Date(y,m,0).getDate();
  const startOffset=(first.getDay()+6)%7;
  const cells=[];
  for(let i=0;i<startOffset;i++) cells.push({out:true,label:''});
  for(let d=1;d<=daysInMonth;d++) cells.push({day:d,iso:`${month}-${String(d).padStart(2,'0')}`});
  while(cells.length%7) cells.push({out:true,label:''});
  const today=new Date().toISOString().slice(0,10);
  return `<div class="calendar-grid comm-calendar"><div class="cal-head">L</div><div class="cal-head">M</div><div class="cal-head">M</div><div class="cal-head">J</div><div class="cal-head">V</div><div class="cal-head">S</div><div class="cal-head">D</div>${cells.map(cell=>{
    if(cell.out) return `<div class="cal-day out"></div>`;
    const dayItems=list.filter(x=>normDate(x.date)===cell.iso);
    return `<div class="cal-day ${cell.iso===today?'today':''}"><div class="cal-num">${cell.day}</div>${dayItems.slice(0,4).map(x=>`<button class="cal-item comm-chip" style="border-left-color:${driverCommColor(x)}" onclick="openDriverComm('${x.id}')">${esc(x.title||'Sin título')}</button>`).join('')}${dayItems.length>4?`<div class="tiny muted">+${dayItems.length-4} más</div>`:''}</div>`;
  }).join('')}</div>`;
}

function onLogin(e){
  e.preventDefault();
  const fd=new FormData(e.target);
  const user=(app.users.length?app.users:DEFAULT_USERS).find(u=>u.id===fd.get('user')&&String(u.password||'')===fd.get('password')&&u.active!==false);
  if(!user) return toast('Clave incorrecta o usuario inactivo','err');
  saveSession(user);
  render();
  load(true);
}

function openForm(title,body,onSave){
  modal.className='modal open';

  document.getElementById('modalForm').onsubmit=async e=>{ e.preventDefault(); const obj=Object.fromEntries(new FormData(e.target).entries()); await onSave(obj); };
}

async function saveInfluencer(obj){
  try{
    if(obj.same_username==='true') obj.tiktok_username='';
    delete obj.same_username;
    ['paid','recorded','published'].forEach(k=>obj[k]=obj[k]==='true');
    obj.updated_at=new Date().toISOString();
    await api('upsertInfluencer',payloadInfluencer(obj));
    const i=app.influencers.findIndex(x=>x.id===obj.id);
    if(i>=0) app.influencers[i]=obj; else app.influencers.unshift(obj);
    closeModal(); toast('Influencer guardado en Google Sheets'); render(); load(true);
  }catch(e){ toast(e.message,'err'); }
}

function fileToPayload(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({name:file.name,type:file.type,data:String(reader.result).split(',')[1]||''});
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(q && c==='"' && n==='"'){ cell+='"'; i++; }
    else if(c==='"'){ q=!q; }
    else if(!q && c===','){ row.push(cell); cell=''; }
    else if(!q && (c==='\n'||c==='\r')){ if(c==='\r'&&n==='\n') i++; row.push(cell); if(row.some(v=>v!=='')) rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  row.push(cell); if(row.some(v=>v!=='')) rows.push(row);
  return rows;
}
function toCSV(rows){
  return rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
}
function mapCSVRow(r){
  const ig=String(r['Usuario IG']||'').trim();
  const tt=String(r['Usuario TikTok']||'').trim();
  const name=String(r['Nombre']||'').trim();
  const platform=String(r['Plataforma']||'').trim().replace('Instagram','IG');
  return {
    id:'inf_'+(name||ig||uid()).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''),
    name,
    ig_username:ig,
    tiktok_username:tt && tt!==ig ? tt : '',
    type:r['Tipo']||'Microinfluencer',
    platform:platform||'IG',
    ig_followers:r['Followers IG']||'',
    tiktok_followers:r['Followers TikTok']||'',
    deliverables:r['Entregables']||'',
    budget:r['Presupuesto']||'',
    paid:boolish(r['Pagado']),
    payment_date:normDate(r['Fecha de pago']),
    recorded:boolish(r['Grabó']),
    published:boolish(r['Publicó']),
    publish_date:normDate(r['Fecha publicación']),
    link:r['Link']||'',
    tiktok_link:r['Link TikTok']||'',
    has_promo_code:boolish(r['Tiene Promo Code']),
    promo_code:r['Promo Code']||'',
    promo_redemptions:r['Redenciones']||'',
    ig_reach:r['IG Reach']||'',
    ig_likes:r['IG Likes']||'',
    ig_comments:r['IG Comentarios']||'',
    ig_shares:r['IG Shares']||'',
    ig_saves:r['IG Saves']||'',
    tiktok_reach:r['TikTok Reach']||'',
    tiktok_likes:r['TikTok Likes']||'',
    tiktok_comments:r['TikTok Comentarios']||'',
    tiktok_shares:r['TikTok Shares']||'',
    tiktok_saves:r['TikTok Saves']||'',
    reach_total:r['Reach total']||'',
    engagement_total:r['Engagement total']||'',
    engagement_rate:r['Engagement rate']||'',
    cost_per_engagement:r['Costo por engagement']||'',
    cpm:r['CPM']||'',
    cost_per_redemption:r['Costo por redención']||'',
    notes:r['Notas']||'',
    updated_at:new Date().toISOString(),
  };
}
async function handleCSVFile(e){
  const file=e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const text=await file.text();
    const rows=parseCSV(text);
    const headers=rows.shift()||[];
    const objects=rows.map(row=>Object.fromEntries(headers.map((h,i)=>[h,row[i]??'']))).map(mapCSVRow).filter(x=>x.name);
    for(const obj of objects) await api('upsertInfluencer',payloadInfluencer(obj));
    toast(`${objects.length} influencers importados`);
    await load(true);
  }catch(err){ toast('No pude importar CSV: '+err.message,'err'); }
  e.target.value='';
}
