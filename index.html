<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yango MKT Venezuela</title>
  <style>
    :root {
      --red:#ff1a1a;
      --red-dark:#b50013;
      --ink:#101828;
      --muted:#66758f;
      --soft:#f6f8fb;
      --line:#dfe7f2;
      --card:#ffffff;
      --green:#16a34a;
      --blue:#0ea5e9;
      --orange:#f97316;
      --purple:#8b5cf6;
      --shadow:0 18px 55px rgba(16,24,40,.10);
    }

    * { box-sizing:border-box; }
    body {
      margin:0;
      background:var(--soft);
      color:var(--ink);
      font-family:"YangoText", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size:13px;
    }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }

    label {
      display:block;
      margin-bottom:6px;
      color:#71809a;
      font-size:11px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    input,select,textarea {
      width:100%;
      min-height:42px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      outline:none;
      background:#fff;
      color:var(--ink);
    }
    textarea { min-height:76px; resize:vertical; }

    .btn {
      border:0;
      border-radius:999px;
      padding:11px 16px;
      background:var(--ink);
      color:#fff;
      font-weight:900;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      white-space:nowrap;
    }
    .btn.red { background:var(--red); }
    .btn.light { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .btn.small { padding:8px 11px; font-size:12px; }
    .btn.danger { color:var(--red); }

    .login {
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:radial-gradient(circle at top left,#fff 0,#f9fafb 35%,#eef3f9 100%);
    }
    .login-card {
      width:min(460px,100%);
      background:#fff;
      border:1px solid var(--line);
      border-radius:30px;
      padding:34px;
      box-shadow:var(--shadow);
    }
    .mark {
      width:48px;
      height:48px;
      border-radius:17px;
      display:grid;
      place-items:center;
      background:var(--red);
      color:#fff;
      font-size:30px;
      font-weight:950;
      letter-spacing:-.08em;
    }
    .login h1 { margin:18px 0 6px; font-size:34px; letter-spacing:-.05em; }
    .login p { margin:0 0 20px; color:var(--muted); }

    .app { min-height:100vh; display:grid; grid-template-columns:272px 1fr; }
    .side {
      background:#fff;
      border-right:1px solid var(--line);
      padding:24px 18px;
      position:sticky;
      top:0;
      height:100vh;
      overflow:auto;
    }
    .brand { display:flex; gap:12px; align-items:center; margin-bottom:30px; }
    .brand .mark { width:42px; height:42px; border-radius:15px; font-size:27px; }
    .brand strong { display:block; font-size:15px; }
    .brand span { display:block; color:var(--muted); font-size:12px; }
    .nav-title {
      margin:24px 10px 9px;
      font-size:11px;
      color:#99a6ba;
      font-weight:950;
      text-transform:uppercase;
      letter-spacing:.14em;
    }
    .nav { display:grid; gap:7px; }
    .nav button {
      border:1px solid transparent;
      background:transparent;
      color:#526176;
      text-align:left;
      padding:12px 13px;
      border-radius:16px;
      font-weight:900;
    }
    .nav button.active { background:#fff1f1; border-color:#ffd8d8; color:var(--red); }
    .side-foot { margin-top:28px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    .sync-dot { display:inline-flex; align-items:center; gap:7px; font-weight:800; }
    .sync-dot:before { content:""; width:8px; height:8px; border-radius:50%; background:var(--green); }
    .sync-dot.warn:before { background:#d97706; }
    .sync-dot.err:before { background:var(--red); }

    .main { width:100%; max-width:1620px; margin:0 auto; padding:32px; min-width:0; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:22px; }
    .top h1 {
      margin:0;
      font-family:"YangoHeadline","YangoText",system-ui,sans-serif;
      font-size:34px;
      line-height:.9;
      letter-spacing:-.06em;
      text-transform:uppercase;
    }
    .top p { margin:8px 0 0; color:var(--muted); font-size:15px; }
    .userbar { display:flex; gap:9px; align-items:center; }

    .hero {
      border-radius:28px;
      padding:26px 28px;
      margin-bottom:22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      color:#fff;
      background:linear-gradient(135deg,#121522 0%,#3a111f 44%,#e60012 100%);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .hero h2 {
      margin:0 0 7px;
      font-size:29px;
      line-height:1;
      letter-spacing:-.04em;
    }
    .hero p { margin:0; color:rgba(255,255,255,.82); font-size:15px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .actions .btn.light { background:#fff; color:var(--ink); }

    .cards {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:13px;
      margin-bottom:22px;
    }
    .card {
      background:#fff;
      border:1px solid var(--line);
      border-radius:22px;
      padding:20px 18px;
      min-height:142px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      box-shadow:0 8px 30px rgba(16,24,40,.025);
    }
    .icon {
      width:42px;
      height:42px;
      border-radius:14px;
      display:grid;
      place-items:center;
      margin-bottom:12px;
      font-weight:950;
    }
    .i-red { background:#ffe9e9; color:var(--red); }
    .i-blue { background:#e8f6ff; color:var(--blue); }
    .i-green { background:#e9fbef; color:var(--green); }
    .i-purple { background:#f0e8ff; color:var(--purple); }
    .i-orange { background:#fff1e7; color:var(--orange); }
    .i-gray { background:#eef2f7; color:var(--ink); }
    .metric {
      font-family:"YangoHeadline","YangoText",system-ui,sans-serif;
      font-size:31px;
      font-weight:950;
      line-height:.9;
      letter-spacing:-.07em;
      margin-bottom:8px;
    }
    .card span { color:var(--muted); font-size:14px; font-weight:800; }

    .filters {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:14px;
      align-items:end;
      margin-bottom:18px;
    }
    .filter-field button { width:100%; min-height:42px; }

    .panel {
      background:#fff;
      border:1px solid var(--line);
      border-radius:24px;
      padding:20px;
      box-shadow:0 8px 30px rgba(16,24,40,.03);
      overflow:hidden;
    }
    .panel-head { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:16px; }
    .panel h3 { margin:0; font-size:20px; }
    .panel p { margin:4px 0 0; color:var(--muted); }
    .table-wrap { overflow:auto; border:1px solid #eef2f7; border-radius:18px; }
    table { width:100%; border-collapse:collapse; min-width:1320px; }
    th,td { padding:14px 16px; border-bottom:1px solid #eef2f7; text-align:left; vertical-align:top; }
    th {
      color:#9aa8bd;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:950;
    }
    td { font-size:13px; }
    .name { font-size:15px; font-weight:950; }
    .muted { color:var(--muted); }
    .tiny { font-size:12px; line-height:1.45; }
    .result-block { min-width:160px; line-height:1.45; }
    .result-title { color:var(--red); font-weight:950; }
    .row-actions { display:flex; gap:7px; }
    .empty { padding:34px; text-align:center; color:var(--muted); }
    .badge {
      display:inline-flex;
      align-items:center;
      gap:6px;
      border-radius:999px;
      padding:6px 10px;
      background:#eef3f9;
      color:#526176;
      font-size:11px;
      font-weight:900;
      margin:2px 0;
    }
    .badge.red { background:#ffe9e9; color:var(--red); }
    .badge.blue { background:#e8f6ff; color:var(--blue); }
    .badge.green { background:#e9fbef; color:var(--green); }
    .badge.gray { background:#eef2f7; color:#64748b; }
    .badge.orange { background:#fff1e7; color:#c2410c; }
    .badge.pink { background:#fce7f3; color:#db2777; }
    .badge.purple { background:#f0e8ff; color:var(--purple); }
    .linkish { color:var(--red); font-weight:950; text-decoration:none; }

    .section-stack { display:grid; gap:22px; }
    .split-2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .split-3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
    .mini-list { display:grid; gap:10px; }
    .mini-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid #eef2f7; }
    .mini-row:last-child { border-bottom:0; }
    .bar { height:9px; border-radius:99px; background:#eef2f7; overflow:hidden; margin-top:8px; }
    .bar span { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--red),#ff7a7a); }
    .location-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
    .location-card { background:#f8fafc; border:1px solid #e7eef7; border-radius:18px; padding:14px; min-height:92px; }
    .location-card strong { display:block; margin-bottom:7px; }
    .funnel { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-items:center; }
    .funnel-card { background:#f8fafc; border:1px solid #eef2f7; border-radius:20px; padding:18px; text-align:center; min-height:128px; }
    .funnel-card .metric { margin-top:8px; }
    .activity-list { display:grid; gap:10px; }
    .activity-row { display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; padding:15px 18px; border:1px solid #e7eef7; border-radius:18px; background:#fff; }
    .activity-meta { color:var(--muted); margin-top:5px; font-size:12px; font-weight:700; }
    .activity-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .calendar-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    .calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:9px; }
    .cal-head { color:#93a1b5; font-weight:950; text-align:center; padding:8px; }
    .cal-day { min-height:120px; background:#fff; border:1px solid #e7eef7; border-radius:18px; padding:10px; overflow:hidden; }
    .cal-day.today { border-color:var(--red); box-shadow:0 0 0 3px #ffe1e1 inset; }
    .cal-day.out { background:#f8fafc; color:#b0bbcc; }
    .cal-num { font-weight:950; color:#71809a; margin-bottom:7px; }
    .cal-item { display:block; border-radius:10px; padding:5px 7px; margin-bottom:5px; background:#f1f5f9; border-left:4px solid #64748b; color:#526176; font-size:11px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle; }
    .agency-shell { min-height:100vh; padding:28px; background:#f6f8fb; }
    .agency-shell .main { padding:0; }
    .photo-chip { display:inline-flex; align-items:center; gap:5px; margin:3px 5px 3px 0; padding:6px 9px; border-radius:999px; background:#eef2f7; color:#526176; font-weight:900; text-decoration:none; font-size:11px; }

    .modal { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:50; }
    .modal.open { display:flex; }
    .modal-card { background:#fff; border-radius:30px; width:min(1080px,100%); max-height:90vh; overflow:auto; padding:24px; box-shadow:var(--shadow); }
    .modal-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:18px; }
    .modal-head h2 { margin:0; font-size:30px; letter-spacing:-.04em; }
    .form-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .form-grid .wide { grid-column:1/-1; }
    .checkline { display:flex; align-items:center; gap:9px; color:var(--ink); font-size:13px; font-weight:900; text-transform:none; letter-spacing:0; }
    .checkline input { width:auto; min-height:auto; }
    .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
    .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#111827; color:#fff; border-radius:999px; padding:12px 16px; font-weight:900; box-shadow:var(--shadow); display:none; z-index:80; }
    .toast.show { display:block; }
    .toast.err { background:var(--red); }

    @media(max-width:1100px) {
      .app { grid-template-columns:1fr; }
      .side { position:relative; height:auto; }
      .main { padding:22px; }
      .hero { display:block; }
      .actions { justify-content:flex-start; margin-top:16px; }
      .cards { grid-template-columns:repeat(2,1fr); }
      .split-2,.split-3,.funnel { grid-template-columns:1fr; }
      .calendar-grid { grid-template-columns:1fr; }
      .activity-row { grid-template-columns:1fr; }
      .form-grid { grid-template-columns:1fr; }
      .top { display:block; }
      .userbar { margin-top:12px; }
    }
    @media(max-width:620px) { .cards { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal"></div>
  <input id="csvInput" type="file" accept=".csv,text/csv" hidden />

<script>
const DEFAULT_USERS = [
  { id:'admin', name:'Isabella', email:'admin@yango.local', role:'admin', password:'Yango2026!', active:true },
  { id:'giselle', name:'Giselle', email:'giselle@yango.local', role:'editor', password:'Giselle2026!', active:true },
];
const EMPTY_FILTERS = { q:'', type:'all', platform:'all', paid:'all', publishedFrom:'', publishedTo:'', paymentFrom:'', paymentTo:'' };
const CSV_HEADERS = [
  'Nombre','Usuario IG','Usuario TikTok','Tipo','Plataforma','Followers IG','Followers TikTok','Entregables','Presupuesto','Pagado','Fecha de pago','Grabó','Publicó','Fecha publicación','Link','Link TikTok','Tiene Promo Code','Promo Code','Redenciones','IG Reach','IG Likes','IG Comentarios','IG Shares','IG Saves','TikTok Reach','TikTok Likes','TikTok Comentarios','TikTok Shares','TikTok Saves','Reach total','Engagement total','Engagement rate','Costo por engagement','CPM','Costo por redención','Notas'
];
const BTL_BUCKETS = {
  'Petare':['Petare','Palo Verde','La Dolorita'],
  'Centro':['Centro de Caracas','La Hoyada','Bellas Artes','Parque Central','Plaza Venezuela','Los Símbolos','Estación 5 de Julio'],
  'Este':['Altamira','Chacaíto','El Recreo','Los Dos Caminos','Los Cortijos','Los Ruices','La California','La Urbina','Macaracuay'],
  'Sureste':['Las Mercedes','Bello Monte','El Cafetal','Caurimare','Prados del Este','Plaza Baruta','Las Minas'],
  'Universidades':['UCAB','Ciudad Universitaria','Monteávila'],
  'Oeste':['Catia','Plaza Sucre','Propatria','Antímano','La Yaguara','La Vega','Montalbán','El Paraíso','El Pinar'],
  'Sur':['Caricuao','El Valle','La Rinconada'],
  'Norte':['San Bernardino','Alta Florida','La Pastora'],
  'Satelites':['Los Teques','San Antonio de los Altos','El Junquito'],
  'Sabana Grande':['Sabana Grande']
};
const BTL_TYPES = ['Flyers','Café','Helados','Material POP','Universidad','Evento'];
const BTL_TYPE_COLORS = {'Flyers':'#64748b','Café':'#b45309','Helados':'#0ea5e9','Material POP':'#db2777','Universidad':'#7c3aed','Evento':'#ec4899'};
const BTL_EMPTY_FILTERS = { from:'', to:'', bucket:'all', type:'all' };
const BTL_STATUS_LABELS = { planned:'Planificada', executed:'Se dio', cancelled:'No se dio' };
const BTL_STATUS_CLASS = { planned:'gray', executed:'green', cancelled:'red' };

let app = {
  session:null,
  agencyMode:new URLSearchParams(location.search).has('agency'),
  view:'btl-global',
  users:[...DEFAULT_USERS],
  influencers:[],
  socialReports:[],
  btlActivations:[],
  btlResults:[],
  agencyReports:[],
  btlBudgets:[],
  loading:true,
  sync:'warn',
  lastSync:null,
  filters:{...EMPTY_FILTERS},
  reportMonth:'all',
  btlFilters:{...BTL_EMPTY_FILTERS},
  calendarMonth:new Date().toISOString().slice(0,7)
};

const root = document.getElementById('root');
const modal = document.getElementById('modal');
const toastEl = document.getElementById('toast');
const csvInput = document.getElementById('csvInput');
const EXTRA_MARKER = '\n\n__YANGO_EXTRA__';
const INFLUENCER_EXTRA_KEYS = [
  'link','tiktok_link','has_promo_code',
  'ig_likes','ig_comments','ig_shares','ig_saves',
  'tiktok_likes','tiktok_comments','tiktok_shares','tiktok_saves',
  'reach_total','engagement_total','engagement_rate',
  'cost_per_engagement','cpm','cost_per_redemption'
];

function uid(prefix='id'){ return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function cleanNumberString(v){
  let s=String(v??'').trim().replace(/[$%\s]/g,'');
  if(!s) return '';
  const comma=s.lastIndexOf(','), dot=s.lastIndexOf('.');
  if(comma>=0 && dot>=0) s = comma>dot ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(comma>=0) s = /,\d{1,2}$/.test(s) ? s.replace(',','.') : s.replace(/,/g,'');
  return s;
}
function n(v){ const x=Number(cleanNumberString(v)); return Number.isFinite(x)?x:0; }
function money(v){ return '$'+n(v).toLocaleString('es-VE'); }
function num(v){ return n(v).toLocaleString('es-VE'); }
function pct(v){ const x=n(v); return x.toLocaleString('es-VE',{maximumFractionDigits:1})+'%'; }
function esc(v){ return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sel(a,b){ return a===b?'value="'+b+'" selected':'value="'+b+'"'; }
function boolish(v){ return v===true || String(v).toLowerCase()==='true' || String(v).toLowerCase()==='sí' || String(v).toLowerCase()==='si'; }
function normDate(v){
  if(!v) return '';
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return '';
}
function fmtDate(d){ const v=normDate(d); if(!v)return '—'; const [y,m,day]=v.split('-'); return `${day}/${m}/${y}`; }
function dateInRange(value,from,to){ const v=normDate(value); return (!from||(v&&v>=from))&&(!to||(v&&v<=to)); }
function monthLabel(m){ if(!m)return '—'; const [y,mo]=String(m).split('-'); const names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; return `${names[Number(mo)-1]||mo} ${y}`; }
function tiktokUser(x){ return String(x.tiktok_username||'').trim() || String(x.ig_username||'').trim(); }
function totalReach(x){ return n(x.reach_total) || n(x.ig_reach)+n(x.tiktok_reach); }
function totalEngagement(x){ return n(x.engagement_total) || n(x.ig_likes)+n(x.ig_comments)+n(x.ig_shares)+n(x.ig_saves)+n(x.tiktok_likes)+n(x.tiktok_comments)+n(x.tiktok_shares)+n(x.tiktok_saves); }
function calcER(list){ const reach=list.reduce((s,x)=>s+totalReach(x),0); const eng=list.reduce((s,x)=>s+totalEngagement(x),0); return reach ? eng/reach*100 : 0; }
function boolBadge(v,yes,no){ return `<span class="badge ${boolish(v)?'green':'gray'}">${boolish(v)?'✓ '+yes:no}</span>`; }
function toast(msg,type='ok'){ toastEl.textContent=msg; toastEl.className='toast show '+(type==='err'?'err':''); setTimeout(()=>toastEl.className='toast',2800); }
function splitExtraNotes(notes){
  const raw=String(notes||'');
  const idx=raw.indexOf(EXTRA_MARKER);
  if(idx<0) return { notes:raw, extra:{} };
  const plain=raw.slice(0,idx).trim();
  const json=raw.slice(idx+EXTRA_MARKER.length).trim();
  try{ return { notes:plain, extra:JSON.parse(json)||{} }; }
  catch(e){ return { notes:raw, extra:{} }; }
}
function hydrateInfluencer(x){
  const parsed=splitExtraNotes(x.notes);
  const out={...x};
  INFLUENCER_EXTRA_KEYS.forEach(k=>{
    if((out[k]===undefined || out[k]==='') && parsed.extra[k]!==undefined) out[k]=parsed.extra[k];
  });
  out.notes=parsed.notes;
  return out;
}
function payloadInfluencer(x){
  const plain=splitExtraNotes(x.notes).notes;
  const extra={};
  INFLUENCER_EXTRA_KEYS.forEach(k=>{ if(x[k]!==undefined && x[k]!==null && x[k]!=='') extra[k]=x[k]; });
  return { ...x, notes: plain + EXTRA_MARKER + JSON.stringify(extra) };
}

async function api(action,payload={}){
  const r=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,payload,actor:app.session?.id||'anonymous',at:new Date().toISOString()})});
  let data={};
  try{ data=await r.json(); }catch(e){}
  if(!r.ok||data.ok===false) throw new Error(data.error||'No se pudo guardar en Google Sheets');
  return data;
}
async function load(silent=false){
  try{
    if(!silent) app.loading=true;
    render();
    const r=await fetch('/api/sync?action=bootstrap',{cache:'no-store'});
    const data=await r.json();
    if(data.ok===false) throw new Error(data.error||'Sync error');
    app.users=(data.users&&data.users.length?data.users:DEFAULT_USERS).filter(u=>u.active!==false);
    app.influencers=(data.influencers||[]).map(hydrateInfluencer).filter(x=>!x.deleted_at);
    app.socialReports=(data.socialReports||[]).filter(x=>!x.deleted_at);
    app.btlActivations=(data.btlActivations||[]).filter(x=>!x.deleted_at);
    app.btlResults=(data.btlResults||[]).filter(x=>!x.deleted_at);
    app.agencyReports=(data.agencyReports||[]).filter(x=>!x.deleted_at);
    app.btlBudgets=(data.btlBudgets||[]).filter(x=>!x.deleted_at);
    app.sync='ok';
    app.lastSync=new Date();
  }catch(e){
    app.users=app.users.length?app.users:DEFAULT_USERS;
    app.sync='err';
    if(!silent) toast('No pude leer Google Sheets: '+e.message,'err');
  }finally{
    app.loading=false;
    render();
  }
}

function metricsInfluencers(list){
  const budget=list.reduce((s,x)=>s+n(x.budget),0);
  const engagement=list.reduce((s,x)=>s+totalEngagement(x),0);
  const reachIG=list.reduce((s,x)=>s+n(x.ig_reach),0);
  const reachTT=list.reduce((s,x)=>s+n(x.tiktok_reach),0);
  const cpmReach=reachIG+reachTT;
  return {
    influencers:list.filter(x=>x.type==='Influencer').length,
    micros:list.filter(x=>x.type==='Microinfluencer').length,
    published:list.filter(x=>boolish(x.published)).length,
    budget,
    reachIG,
    reachTT,
    promo:list.reduce((s,x)=>s+n(x.promo_redemptions),0),
    engagement,
    er:calcER(list),
    cpm:cpmReach ? budget/cpmReach*1000 : 0,
  };
}

function btlCalendarView(){
  const month=app.calendarMonth || new Date().toISOString().slice(0,7);
  const [year,mo]=month.split('-').map(Number);
  const first=new Date(year,mo-1,1);
  const start=new Date(first); start.setDate(first.getDate()-((first.getDay()+6)%7));
  const days=Array.from({length:42},(_,i)=>{const d=new Date(start); d.setDate(start.getDate()+i); return d;});
  const monthActs=app.btlActivations.filter(x=>normDate(x.date).slice(0,7)===month && String(x.name||'').trim());
  const planned=monthActs.reduce((s,x)=>s+n(x.budget||x.cost),0);
  const budget=app.btlBudgets.find(x=>x.period===month)||{};
  const q='Q'+Math.ceil(mo/3)+' '+year;
  const qMonths=[0,1,2].map(i=>`${year}-${String((Math.ceil(mo/3)-1)*3+i+1).padStart(2,'0')}`);
  const qPlanned=app.btlActivations.filter(x=>qMonths.includes(normDate(x.date).slice(0,7))).reduce((s,x)=>s+n(x.budget||x.cost),0);
  const qBudget=app.btlBudgets.find(x=>x.period===q)||{};
  return `<section class="hero"><div><h2>${monthLabel(month)}</h2><p>Calendario de activaciones y budget.</p></div><div class="actions"><button class="btn light" onclick="shiftCalendar(-1)">‹ Mes anterior</button><button class="btn light" onclick="shiftCalendar(1)">Mes siguiente ›</button><button class="btn light" onclick="openActivation()">+ Nueva activación</button></div></section>
  <section class="split-2"><div class="panel"><div class="panel-head"><div><h3>${monthLabel(month)}</h3><p>${money(planned)} planificado</p></div><button class="btn light small" onclick="openBudget('${month}','Mes')">Budget</button></div><div class="bar"><span style="width:${n(budget.amount)?Math.min(100,planned/n(budget.amount)*100):0}%"></span></div><p>${n(budget.amount)?`${pct(planned/n(budget.amount)*100)} del budget (${money(budget.amount)})`:'Carga el budget del mes para compararlo.'}</p></div><div class="panel"><div class="panel-head"><div><h3>${q}</h3><p>${money(qPlanned)} planificado</p></div><button class="btn light small" onclick="openBudget('${q}','Q')">Budget</button></div><div class="bar"><span style="width:${n(qBudget.amount)?Math.min(100,qPlanned/n(qBudget.amount)*100):0}%"></span></div><p>${n(qBudget.amount)?`${pct(qPlanned/n(qBudget.amount)*100)} del budget (${money(qBudget.amount)})`:'Carga el budget del Q para compararlo.'}</p></div></section>
  <section class="panel" style="margin-top:22px"><h3>Leyenda de calendario</h3><p>${BTL_TYPES.map(t=>`<span style="margin-right:14px"><span class="dot" style="background:${btlColor(t)}"></span>${t}</span>`).join('')}<span><span class="dot" style="border:2px solid #f59e0b;background:white"></span>Verificada Mystery Shopper</span></p><div class="calendar-grid"><div class="cal-head">L</div><div class="cal-head">M</div><div class="cal-head">M</div><div class="cal-head">J</div><div class="cal-head">V</div><div class="cal-head">S</div><div class="cal-head">D</div>${days.map(day=>calendarDay(day,mo)).join('')}</div></section>`;
}
function calendarDay(day,monthNum){
  const iso=day.toISOString().slice(0,10);
  const acts=app.btlActivations.filter(x=>normDate(x.date)===iso && String(x.name||'').trim());
  const today=new Date().toISOString().slice(0,10)===iso;
  return `<div class="cal-day ${day.getMonth()+1!==monthNum?'out':''} ${today?'today':''}"><div class="cal-num">${day.getDate()}</div>${acts.slice(0,4).map(x=>`<button class="cal-item" style="border-left-color:${btlColor(x.type||x.activation_type)}" onclick="openActivation('${x.id}')" title="${esc(x.name)}">${esc(x.real_location||x.location||x.name)}</button>`).join('')}${acts.length>4?`<div class="tiny muted">+${acts.length-4} más</div>`:''}</div>`;
}
function shiftCalendar(delta){
  const [y,m]=app.calendarMonth.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  app.calendarMonth=d.toISOString().slice(0,7);
  render();
}

  if(app.view==='btl-activations') return btlActivationsView();

function onLogin(e){
  e.preventDefault();
  const fd=new FormData(e.target);
  const user=(app.users.length?app.users:DEFAULT_USERS).find(u=>u.id===fd.get('user')&&String(u.password||'')===fd.get('password')&&u.active!==false);
  if(!user) return toast('Clave incorrecta o usuario inactivo','err');
  saveSession(user);
  render();
  load(true);
}

function fileToPayload(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({name:file.name,type:file.type,data:String(reader.result).split(',')[1]||''});
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(q && c==='"' && n==='"'){ cell+='"'; i++; }
    else if(c==='"'){ q=!q; }
    else if(!q && c===','){ row.push(cell); cell=''; }
    else if(!q && (c==='\n'||c==='\r')){ if(c==='\r'&&n==='\n') i++; row.push(cell); if(row.some(v=>v!=='')) rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  row.push(cell); if(row.some(v=>v!=='')) rows.push(row);
  return rows;
}
function toCSV(rows){
  return rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
}
function mapCSVRow(r){
  const ig=String(r['Usuario IG']||'').trim();
  const tt=String(r['Usuario TikTok']||'').trim();
  const name=String(r['Nombre']||'').trim();
  const platform=String(r['Plataforma']||'').trim().replace('Instagram','IG');
  return {
    id:'inf_'+(name||ig||uid()).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''),
    name,
    ig_username:ig,
    tiktok_username:tt && tt!==ig ? tt : '',
    type:r['Tipo']||'Microinfluencer',
    platform:platform||'IG',
    ig_followers:r['Followers IG']||'',
    tiktok_followers:r['Followers TikTok']||'',
    deliverables:r['Entregables']||'',
    budget:r['Presupuesto']||'',
    paid:boolish(r['Pagado']),
    payment_date:normDate(r['Fecha de pago']),
    recorded:boolish(r['Grabó']),
    published:boolish(r['Publicó']),
    publish_date:normDate(r['Fecha publicación']),
    link:r['Link']||'',
    tiktok_link:r['Link TikTok']||'',
    has_promo_code:boolish(r['Tiene Promo Code']),
    promo_code:r['Promo Code']||'',
    promo_redemptions:r['Redenciones']||'',
    ig_reach:r['IG Reach']||'',
    ig_likes:r['IG Likes']||'',
    ig_comments:r['IG Comentarios']||'',
    ig_shares:r['IG Shares']||'',
    ig_saves:r['IG Saves']||'',
    tiktok_reach:r['TikTok Reach']||'',
    tiktok_likes:r['TikTok Likes']||'',
    tiktok_comments:r['TikTok Comentarios']||'',
    tiktok_shares:r['TikTok Shares']||'',
    tiktok_saves:r['TikTok Saves']||'',
    reach_total:r['Reach total']||'',
    engagement_total:r['Engagement total']||'',
    engagement_rate:r['Engagement rate']||'',
    cost_per_engagement:r['Costo por engagement']||'',
    cpm:r['CPM']||'',
    cost_per_redemption:r['Costo por redención']||'',
    notes:r['Notas']||'',
    updated_at:new Date().toISOString(),
  };
}
async function handleCSVFile(e){
  const file=e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const text=await file.text();
    const rows=parseCSV(text);
    const headers=rows.shift()||[];
    const objects=rows.map(row=>Object.fromEntries(headers.map((h,i)=>[h,row[i]??'']))).map(mapCSVRow).filter(x=>x.name);
    for(const obj of objects) await api('upsertInfluencer',payloadInfluencer(obj));
    toast(`${objects.length} influencers importados`);
    await load(true);
  }catch(err){ toast('No pude importar CSV: '+err.message,'err'); }
  e.target.value='';
}

}
