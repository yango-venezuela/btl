<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yango MKT Venezuela</title>
  <style>
    :root {
      --red:#ff1a1a;
      --red-dark:#b50013;
      --ink:#101828;
      --muted:#66758f;
      --soft:#f6f8fb;
      --line:#dfe7f2;
      --card:#ffffff;
      --green:#16a34a;
      --blue:#0ea5e9;
      --orange:#f97316;
      --purple:#8b5cf6;
      --shadow:0 18px 55px rgba(16,24,40,.10);
    }

    * { box-sizing:border-box; }
    body {
      margin:0;
      background:var(--soft);
      color:var(--ink);
      font-family:"YangoText", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size:13px;
    }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }

    label {
      display:block;
      margin-bottom:6px;
      color:#71809a;
      font-size:11px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    input,select,textarea {
      width:100%;
      min-height:42px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      outline:none;
      background:#fff;
      color:var(--ink);
    }
    textarea { min-height:76px; resize:vertical; }

    .btn {
      border:0;
      border-radius:999px;
      padding:11px 16px;
      background:var(--ink);
      color:#fff;
      font-weight:900;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      white-space:nowrap;
    }
    .btn.red { background:var(--red); }
    .btn.light { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .btn.small { padding:8px 11px; font-size:12px; }
    .btn.danger { color:var(--red); }

    .login {
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:radial-gradient(circle at top left,#fff 0,#f9fafb 35%,#eef3f9 100%);
    }
    .login-card {
      width:min(460px,100%);
      background:#fff;
      border:1px solid var(--line);
      border-radius:30px;
      padding:34px;
      box-shadow:var(--shadow);
    }
    .mark {
      width:48px;
      height:48px;
      border-radius:17px;
      display:grid;
      place-items:center;
      background:var(--red);
      color:#fff;
      font-size:30px;
      font-weight:950;
      letter-spacing:-.08em;
    }
    .login h1 { margin:18px 0 6px; font-size:34px; letter-spacing:-.05em; }
    .login p { margin:0 0 20px; color:var(--muted); }

    .app { min-height:100vh; display:grid; grid-template-columns:272px 1fr; }
    .side {
      background:#fff;
      border-right:1px solid var(--line);
      padding:24px 18px;
      position:sticky;
      top:0;
      height:100vh;
      overflow:auto;
    }
    .brand { display:flex; gap:12px; align-items:center; margin-bottom:30px; }
    .brand .mark { width:42px; height:42px; border-radius:15px; font-size:27px; }
    .brand strong { display:block; font-size:15px; }
    .brand span { display:block; color:var(--muted); font-size:12px; }
    .nav-title {
      margin:24px 10px 9px;
      font-size:11px;
      color:#99a6ba;
      font-weight:950;
      text-transform:uppercase;
      letter-spacing:.14em;
    }
    .nav { display:grid; gap:7px; }
    .nav button {
      border:1px solid transparent;
      background:transparent;
      color:#526176;
      text-align:left;
      padding:12px 13px;
      border-radius:16px;
      font-weight:900;
    }
    .nav button.active { background:#fff1f1; border-color:#ffd8d8; color:var(--red); }
    .side-foot { margin-top:28px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    .sync-dot { display:inline-flex; align-items:center; gap:7px; font-weight:800; }
    .sync-dot:before { content:""; width:8px; height:8px; border-radius:50%; background:var(--green); }
    .sync-dot.warn:before { background:#d97706; }
    .sync-dot.err:before { background:var(--red); }

    .main { width:100%; max-width:1620px; margin:0 auto; padding:32px; min-width:0; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:22px; }
    .top h1 {
      margin:0;
      font-family:"YangoHeadline","YangoText",system-ui,sans-serif;
      font-size:34px;
      line-height:.9;
      letter-spacing:-.06em;
      text-transform:uppercase;
    }
    .top p { margin:8px 0 0; color:var(--muted); font-size:15px; }
    .userbar { display:flex; gap:9px; align-items:center; }

    .hero {
      border-radius:28px;
      padding:26px 28px;
      margin-bottom:22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      color:#fff;
      background:linear-gradient(135deg,#121522 0%,#3a111f 44%,#e60012 100%);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .hero h2 {
      margin:0 0 7px;
      font-size:29px;
      line-height:1;
      letter-spacing:-.04em;
    }
    .hero p { margin:0; color:rgba(255,255,255,.82); font-size:15px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .actions .btn.light { background:#fff; color:var(--ink); }

    .cards {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:13px;
      margin-bottom:22px;
    }
    .card {
      background:#fff;
      border:1px solid var(--line);
      border-radius:22px;
      padding:20px 18px;
      min-height:142px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      box-shadow:0 8px 30px rgba(16,24,40,.025);
    }
    .icon {
      width:42px;
      height:42px;
      border-radius:14px;
      display:grid;
      place-items:center;
      margin-bottom:12px;
      font-weight:950;
    }
    .i-red { background:#ffe9e9; color:var(--red); }
    .i-blue { background:#e8f6ff; color:var(--blue); }
    .i-green { background:#e9fbef; color:var(--green); }
    .i-purple { background:#f0e8ff; color:var(--purple); }
    .i-orange { background:#fff1e7; color:var(--orange); }
    .i-gray { background:#eef2f7; color:var(--ink); }
    .metric {
      font-family:"YangoHeadline","YangoText",system-ui,sans-serif;
      font-size:31px;
      font-weight:950;
      line-height:.9;
      letter-spacing:-.07em;
      margin-bottom:8px;
    }
    .card span { color:var(--muted); font-size:14px; font-weight:800; }

    .filters {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:14px;
      align-items:end;
      margin-bottom:18px;
    }
    .filter-field button { width:100%; min-height:42px; }

    .panel {
      background:#fff;
      border:1px solid var(--line);
      border-radius:24px;
      padding:20px;
      box-shadow:0 8px 30px rgba(16,24,40,.03);
      overflow:hidden;
    }
    .panel-head { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:16px; }
    .panel h3 { margin:0; font-size:20px; }
    .panel p { margin:4px 0 0; color:var(--muted); }
    .table-wrap { overflow:auto; border:1px solid #eef2f7; border-radius:18px; }
    table { width:100%; border-collapse:collapse; min-width:1320px; }
    th,td { padding:14px 16px; border-bottom:1px solid #eef2f7; text-align:left; vertical-align:top; }
    th {
      color:#9aa8bd;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:950;
    }
    td { font-size:13px; }
    .name { font-size:15px; font-weight:950; }
    .muted { color:var(--muted); }
    .tiny { font-size:12px; line-height:1.45; }
    .result-block { min-width:160px; line-height:1.45; }
    .result-title { color:var(--red); font-weight:950; }
    .row-actions { display:flex; gap:7px; }
    .empty { padding:34px; text-align:center; color:var(--muted); }
    .badge {
      display:inline-flex;
      align-items:center;
      gap:6px;
      border-radius:999px;
      padding:6px 10px;
      background:#eef3f9;
      color:#526176;
      font-size:11px;
      font-weight:900;
      margin:2px 0;
    }
    .badge.red { background:#ffe9e9; color:var(--red); }
    .badge.blue { background:#e8f6ff; color:var(--blue); }
    .badge.green { background:#e9fbef; color:var(--green); }
    .badge.gray { background:#eef2f7; color:#64748b; }
    .linkish { color:var(--red); font-weight:950; text-decoration:none; }

    .modal { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:50; }
    .modal.open { display:flex; }
    .modal-card { background:#fff; border-radius:30px; width:min(1080px,100%); max-height:90vh; overflow:auto; padding:24px; box-shadow:var(--shadow); }
    .modal-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:18px; }
    .modal-head h2 { margin:0; font-size:30px; letter-spacing:-.04em; }
    .form-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .form-grid .wide { grid-column:1/-1; }
    .checkline { display:flex; align-items:center; gap:9px; color:var(--ink); font-size:13px; font-weight:900; text-transform:none; letter-spacing:0; }
    .checkline input { width:auto; min-height:auto; }
    .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
    .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#111827; color:#fff; border-radius:999px; padding:12px 16px; font-weight:900; box-shadow:var(--shadow); display:none; z-index:80; }
    .toast.show { display:block; }
    .toast.err { background:var(--red); }

    @media(max-width:1100px) {
      .app { grid-template-columns:1fr; }
      .side { position:relative; height:auto; }
      .main { padding:22px; }
      .hero { display:block; }
      .actions { justify-content:flex-start; margin-top:16px; }
      .cards { grid-template-columns:repeat(2,1fr); }
      .form-grid { grid-template-columns:1fr; }
      .top { display:block; }
      .userbar { margin-top:12px; }
    }
    @media(max-width:620px) { .cards { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal"></div>
  <input id="csvInput" type="file" accept=".csv,text/csv" hidden />

<script>
const DEFAULT_USERS = [
  { id:'admin', name:'Isabella', email:'admin@yango.local', role:'admin', password:'Yango2026!', active:true },
  { id:'giselle', name:'Giselle', email:'giselle@yango.local', role:'editor', password:'Giselle2026!', active:true },
];
const EMPTY_FILTERS = { q:'', type:'all', platform:'all', paid:'all', publishedFrom:'', publishedTo:'', paymentFrom:'', paymentTo:'' };
const CSV_HEADERS = [
  'Nombre','Usuario IG','Usuario TikTok','Tipo','Plataforma','Followers IG','Followers TikTok','Entregables','Presupuesto','Pagado','Fecha de pago','Grabó','Publicó','Fecha publicación','Link','Link TikTok','Tiene Promo Code','Promo Code','Redenciones','IG Reach','IG Likes','IG Comentarios','IG Shares','IG Saves','TikTok Reach','TikTok Likes','TikTok Comentarios','TikTok Shares','TikTok Saves','Reach total','Engagement total','Engagement rate','Costo por engagement','CPM','Costo por redención','Notas'
];

let app = {
  session:null,
  view:'influencers',
  users:[...DEFAULT_USERS],
  influencers:[],
  socialReports:[],
  loading:true,
  sync:'warn',
  lastSync:null,
  filters:{...EMPTY_FILTERS},
  reportMonth:'all'
};

const root = document.getElementById('root');
const modal = document.getElementById('modal');
const toastEl = document.getElementById('toast');
const csvInput = document.getElementById('csvInput');
const EXTRA_MARKER = '\n\n__YANGO_EXTRA__';
const INFLUENCER_EXTRA_KEYS = [
  'link','tiktok_link','has_promo_code',
  'ig_likes','ig_comments','ig_shares','ig_saves',
  'tiktok_likes','tiktok_comments','tiktok_shares','tiktok_saves',
  'reach_total','engagement_total','engagement_rate',
  'cost_per_engagement','cpm','cost_per_redemption'
];

function uid(prefix='id'){ return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function cleanNumberString(v){
  let s=String(v??'').trim().replace(/[$%\s]/g,'');
  if(!s) return '';
  const comma=s.lastIndexOf(','), dot=s.lastIndexOf('.');
  if(comma>=0 && dot>=0) s = comma>dot ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(comma>=0) s = /,\d{1,2}$/.test(s) ? s.replace(',','.') : s.replace(/,/g,'');
  return s;
}
function n(v){ const x=Number(cleanNumberString(v)); return Number.isFinite(x)?x:0; }
function money(v){ return '$'+n(v).toLocaleString('es-VE'); }
function num(v){ return n(v).toLocaleString('es-VE'); }
function pct(v){ const x=n(v); return x.toLocaleString('es-VE',{maximumFractionDigits:1})+'%'; }
function esc(v){ return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sel(a,b){ return a===b?'value="'+b+'" selected':'value="'+b+'"'; }
function boolish(v){ return v===true || String(v).toLowerCase()==='true' || String(v).toLowerCase()==='sí' || String(v).toLowerCase()==='si'; }
function normDate(v){
  if(!v) return '';
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return '';
}
function fmtDate(d){ const v=normDate(d); if(!v)return '—'; const [y,m,day]=v.split('-'); return `${day}/${m}/${y}`; }
function dateInRange(value,from,to){ const v=normDate(value); return (!from||(v&&v>=from))&&(!to||(v&&v<=to)); }
function monthLabel(m){ if(!m)return '—'; const [y,mo]=String(m).split('-'); const names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; return `${names[Number(mo)-1]||mo} ${y}`; }
function tiktokUser(x){ return String(x.tiktok_username||'').trim() || String(x.ig_username||'').trim(); }
function totalReach(x){ return n(x.reach_total) || n(x.ig_reach)+n(x.tiktok_reach); }
function totalEngagement(x){ return n(x.engagement_total) || n(x.ig_likes)+n(x.ig_comments)+n(x.ig_shares)+n(x.ig_saves)+n(x.tiktok_likes)+n(x.tiktok_comments)+n(x.tiktok_shares)+n(x.tiktok_saves); }
function calcER(list){ const reach=list.reduce((s,x)=>s+totalReach(x),0); const eng=list.reduce((s,x)=>s+totalEngagement(x),0); return reach ? eng/reach*100 : 0; }
function boolBadge(v,yes,no){ return `<span class="badge ${boolish(v)?'green':'gray'}">${boolish(v)?'✓ '+yes:no}</span>`; }
function toast(msg,type='ok'){ toastEl.textContent=msg; toastEl.className='toast show '+(type==='err'?'err':''); setTimeout(()=>toastEl.className='toast',2800); }
function splitExtraNotes(notes){
  const raw=String(notes||'');
  const idx=raw.indexOf(EXTRA_MARKER);
  if(idx<0) return { notes:raw, extra:{} };
  const plain=raw.slice(0,idx).trim();
  const json=raw.slice(idx+EXTRA_MARKER.length).trim();
  try{ return { notes:plain, extra:JSON.parse(json)||{} }; }
  catch(e){ return { notes:raw, extra:{} }; }
}
function hydrateInfluencer(x){
  const parsed=splitExtraNotes(x.notes);
  const out={...x};
  INFLUENCER_EXTRA_KEYS.forEach(k=>{
    if((out[k]===undefined || out[k]==='') && parsed.extra[k]!==undefined) out[k]=parsed.extra[k];
  });
  out.notes=parsed.notes;
  return out;
}
function payloadInfluencer(x){
  const plain=splitExtraNotes(x.notes).notes;
  const extra={};
  INFLUENCER_EXTRA_KEYS.forEach(k=>{ if(x[k]!==undefined && x[k]!==null && x[k]!=='') extra[k]=x[k]; });
  return { ...x, notes: plain + EXTRA_MARKER + JSON.stringify(extra) };
}

async function api(action,payload={}){
  const r=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,payload,actor:app.session?.id||'anonymous',at:new Date().toISOString()})});
  let data={};
  try{ data=await r.json(); }catch(e){}
  if(!r.ok||data.ok===false) throw new Error(data.error||'No se pudo guardar en Google Sheets');
  return data;
}
async function load(silent=false){
  try{
    if(!silent) app.loading=true;
    render();
    const r=await fetch('/api/sync?action=bootstrap',{cache:'no-store'});
    const data=await r.json();
    if(data.ok===false) throw new Error(data.error||'Sync error');
    app.users=(data.users&&data.users.length?data.users:DEFAULT_USERS).filter(u=>u.active!==false);
    app.influencers=(data.influencers||[]).map(hydrateInfluencer).filter(x=>!x.deleted_at);
    app.socialReports=(data.socialReports||[]).filter(x=>!x.deleted_at);
    app.sync='ok';
    app.lastSync=new Date();
  }catch(e){
    app.users=app.users.length?app.users:DEFAULT_USERS;
    app.sync='err';
    if(!silent) toast('No pude leer Google Sheets: '+e.message,'err');
  }finally{
    app.loading=false;
    render();
  }
}

function saveSession(user){ app.session={id:user.id,name:user.name,email:user.email,role:user.role}; localStorage.setItem('yango_mkt_session',JSON.stringify(app.session)); }
function boot(){ try{app.session=JSON.parse(localStorage.getItem('yango_mkt_session')||'null')}catch(e){} load(); setInterval(()=>{if(app.session)load(true)},12000); csvInput.addEventListener('change',handleCSVFile); }
function loginHTML(){ return `<div class="login"><div class="login-card"><div class="mark">Y</div><h1>Yango MKT</h1><p>Social Media · panel compartido</p><form id="loginForm"><div class="field"><label>Usuario</label><select name="user"><option value="admin">Isabella / Admin</option><option value="giselle">Giselle</option></select></div><div class="field"><label>Clave</label><input name="password" type="password" placeholder="Clave" required></div><button class="btn red" style="width:100%">Entrar</button></form><p style="font-size:12px;margin-top:16px">La data se lee y se guarda en Google Sheets vía Apps Script.</p></div></div>`; }
function layout(content){
  const syncClass=app.sync==='ok'?'':app.sync==='err'?'err':'warn';
  return `<div class="app"><aside class="side"><div class="brand"><div class="mark">Y</div><div><strong>Yango MKT</strong><span>Venezuela</span></div></div><div class="nav"><div class="nav-title">Social Media</div>${navBtn('influencers','Influencers')}${navBtn('social-report','Reporte Social Media')}<div class="nav-title">Admin</div>${navBtn('users','Usuarios')}</div><div class="side-foot"><div class="sync-dot ${syncClass}">${app.sync==='ok'?'Sincronizado':'Revisar sync'}</div>${app.lastSync?`<br><br>Última lectura: ${app.lastSync.toLocaleTimeString('es-VE')}`:''}</div></aside><main class="main"><div class="top"><div><h1>${title()}</h1><p>${subtitle()}</p></div><div class="userbar"><span class="badge red">${esc(app.session?.name||'')}</span><button class="btn light small" onclick="logout()">Salir</button></div></div>${content}</main></div>`;
}
function navBtn(id,label){ return `<button class="${app.view===id?'active':''}" onclick="go('${id}')">${label}</button>`; }
function title(){ return app.view==='influencers'?'IG, TikTok e Influencers':app.view==='social-report'?'Reporte Social Media':'Usuarios'; }
function subtitle(){ return app.view==='influencers'?'Tracking de creadores, entregables, pagos y resultados.':app.view==='social-report'?'Followers, reach, clicks, installs y orders por mes.':'Administrar accesos al panel compartido.'; }
function go(view){ app.view=view; render(); }
function logout(){ localStorage.removeItem('yango_mkt_session'); app.session=null; render(); }

function metricsInfluencers(list){
  const budget=list.reduce((s,x)=>s+n(x.budget),0);
  const engagement=list.reduce((s,x)=>s+totalEngagement(x),0);
  const reachIG=list.reduce((s,x)=>s+n(x.ig_reach),0);
  const reachTT=list.reduce((s,x)=>s+n(x.tiktok_reach),0);
  const cpmReach=reachIG+reachTT;
  return {
    influencers:list.filter(x=>x.type==='Influencer').length,
    micros:list.filter(x=>x.type==='Microinfluencer').length,
    published:list.filter(x=>boolish(x.published)).length,
    budget,
    reachIG,
    reachTT,
    promo:list.reduce((s,x)=>s+n(x.promo_redemptions),0),
    engagement,
    er:calcER(list),
    cpm:cpmReach ? budget/cpmReach*1000 : 0,
  };
}
function filteredInfluencers(){
  return app.influencers.filter(x=>{
    const q=String(app.filters.q||'').toLowerCase();
    return (!q||[x.name,x.ig_username,tiktokUser(x),x.deliverables,x.promo_code].join(' ').toLowerCase().includes(q))
      && (app.filters.type==='all'||x.type===app.filters.type)
      && (app.filters.platform==='all'||x.platform===app.filters.platform)
      && (app.filters.paid==='all'||String(boolish(x.paid))===app.filters.paid)
      && dateInRange(x.publish_date,app.filters.publishedFrom,app.filters.publishedTo)
      && dateInRange(x.payment_date,app.filters.paymentFrom,app.filters.paymentTo);
  });
}

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(q && c==='"' && n==='"'){ cell+='"'; i++; }
    else if(c==='"'){ q=!q; }
    else if(!q && c===','){ row.push(cell); cell=''; }
    else if(!q && (c==='\n'||c==='\r')){ if(c==='\r'&&n==='\n') i++; row.push(cell); if(row.some(v=>v!=='')) rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  row.push(cell); if(row.some(v=>v!=='')) rows.push(row);
  return rows;
}
function toCSV(rows){
  return rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
}

    notes:r['Notas']||'',
    updated_at:new Date().toISOString(),
  };
}
async function handleCSVFile(e){
  const file=e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const text=await file.text();
    const rows=parseCSV(text);
    const headers=rows.shift()||[];
    const objects=rows.map(row=>Object.fromEntries(headers.map((h,i)=>[h,row[i]??'']))).map(mapCSVRow).filter(x=>x.name);
    for(const obj of objects) await api('upsertInfluencer',payloadInfluencer(obj));
    toast(`${objects.length} influencers importados`);
    await load(true);
  }catch(err){ toast('No pude importar CSV: '+err.message,'err'); }
  e.target.value='';
}
function influencerToCSVRow(x){
  return [
    x.name,x.ig_username,tiktokUser(x),x.type,x.platform,x.ig_followers,x.tiktok_followers,x.deliverables,x.budget,boolish(x.paid)?'Sí':'No',normDate(x.payment_date),boolish(x.recorded)?'Sí':'No',boolish(x.published)?'Sí':'No',normDate(x.publish_date),x.link,x.tiktok_link,x.promo_code?'Sí':'No',x.promo_code,x.promo_redemptions,x.ig_reach,x.ig_likes,x.ig_comments,x.ig_shares,x.ig_saves,x.tiktok_reach,x.tiktok_likes,x.tiktok_comments,x.tiktok_shares,x.tiktok_saves,totalReach(x),totalEngagement(x),x.engagement_rate||pct(metricsInfluencers([x]).er),x.cost_per_engagement,x.cpm||money(metricsInfluencers([x]).cpm),x.cost_per_redemption,x.notes
  ];
}
function downloadInfluencersCSV(){
  const rows=[CSV_HEADERS,...filteredInfluencers().map(influencerToCSVRow)];
  const blob=new Blob([toCSV(rows)],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='yango_influencers_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

boot();
